[build-system]
requires = ["setuptools>=61", "wheel", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "readim7"
version = "0.9.1"
description = "Read and write native DaVis images and vectors filetypes VC7 and IM7"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
viewer = [
    "dearpygui>=2.0.0",
    "marimo>=0.10.0",
    "pillow>=10.0.0",
]
analysis = [
    "xarray>=2024.1.0",
    "scipy>=1.10.0",
    "h5py>=3.8.0",
]
all = [
    "dearpygui>=2.0.0",
    "marimo>=0.10.0",
    "pillow>=10.0.0",
    "xarray>=2024.1.0",
    "scipy>=1.10.0",
    "h5py>=3.8.0",
]

[project.scripts]
readim7-view = "readim7.viewer.standalone:main"
readim7-marimo = "readim7.viewer.marimo_app:main"
readim7-finder-action = "readim7.viewer.mac_action:main"

[tool.cibuildwheel]
# pure C++ extension, no external deps beyond numpy (installed from PyPI wheels)
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux* *_i686 pp*"
test-command = "python -c \"import readim7; f=readim7.get_sample_image_filenames()[0]; b,a=readim7.get_Buffer_andAttributeList(f); arr,_=readim7.buffer_as_array(b); print(arr.shape)\""
